name: RELEASE

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }} on ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macOS (Apple Silicon)
            runner: macos-latest
            target: aarch64-apple-darwin
            artifact: a3-cli-macos-aarch64
          - os: Linux
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: a3-cli-linux-x86_64
          - os: Windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: a3-cli-windows-x86_64.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}
      - run: cargo build -r -p a3-cli
      - name: prepare artifact
        shell: bash
        run: |
          mkdir dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp target/${{ matrix.target }}/release/a3-cli.exe dist/${{ matrix.artifact }}
          else
            cp target/${{ matrix.target }}/release/a3-cli dist/${{ matrix.artifact }}
          fi
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
