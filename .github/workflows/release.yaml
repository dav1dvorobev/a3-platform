name: RELEASE

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Test
    uses: ./.github/workflows/ci.yaml

  build:
    name: Build ${{ matrix.target }}
    needs: test
    strategy:
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            artifact: a3-cli-macos-aarch64
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: a3-cli-linux-x86_64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: a3-cli-windows-x86_64.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}
      - run: cargo build -r -p a3-cli --target ${{ matrix.target }}
      - name: prepare artifact
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp target/${{ matrix.target }}/release/a3-cli.exe ${{ matrix.artifact }}
          else
            cp target/${{ matrix.target }}/release/a3-cli ${{ matrix.artifact }}
          fi
      - uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          files: ${{ matrix.artifact }}
